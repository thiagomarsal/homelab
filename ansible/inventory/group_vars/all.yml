# kube-vip configuration
# Corrected 2026-08-21 from v0.9.1 to match the live DaemonSet image
# (ghcr.io/kube-vip/kube-vip:v0.8.7). The pin was AHEAD of reality: it is only
# consumed by roles/k3s-server/templates/kube-vip-daemonset.yml.j2, which is
# deployed `when: k3s_init`, so nothing had re-applied it and the drift stayed
# invisible. Left at the deployed version deliberately — upgrading kube-vip
# moves the API VIP and should be a separate, intentional change, not a
# side effect of the next bootstrap.
# Verify with: kubectl -n kube-system get pods -l app.kubernetes.io/name=kube-vip \
#   -o jsonpath='{.items[0].spec.containers[0].image}'
kubevip_version: "v0.8.7"
kubevip_interface: "eth0"  # Default virtio NIC name in Proxmox VMs

# MetalLB configuration
metallb_version: "v0.14.9"
metallb_ip_range: "192.168.1.61-192.168.1.199"

# Rancher configuration
rancher_hostname: "rancher.tmf-solutions.com"  # Update with your actual domain
rancher_version: "2.13.3"
cert_manager_version: "v1.16.3"

# Common packages to install on all nodes
common_packages:
  - curl
  - wget
  - vim
  - htop
  - net-tools
  - open-iscsi
  - nfs-common
  - qemu-guest-agent
  - sudo

# journald ceiling applied by playbooks/infra/journald-cap.yml. Unset means
# "10% of the filesystem", which on the 100GB guests let three journals reach
# ~3.9GB each before 2026-08-28.
journald_max_use: "500M"

traefik_hostname: "traefik.tmf-solutions.com"

# Longhorn
# ⚠ READ BEFORE RUNNING THE LONGHORN TASK — the live release did NOT come from
# this playbook, so this pin alone cannot make a re-run safe.
#
# Deployed (verified 2026-08-21): chart `longhorn-108.3.0+up1.11.1`, app v1.11.1,
# plus a SEPARATE `longhorn-crd-108.3.0+up1.11.1` release. That packaging is
# Rancher's (rancher-charts / Rancher catalog). This role instead installs from
# `https://charts.longhorn.io` (roles/rancher/tasks/main.yml), whose chart
# versions are plain semver like `1.11.1` and which bundles CRDs into the main
# chart rather than a second release.
#
# So `helm upgrade --install longhorn longhorn/longhorn` would not just change a
# version — it would switch the release to a different chart lineage, with
# different default values and contested CRD ownership against the existing
# longhorn-crd release.
#
# The old value here was "v1.7.2": both the wrong version (a downgrade from the
# deployed v1.11.1, with newer CRDs left in place) and the wrong format for the
# official repo, which has no `v` prefix. Set to 1.11.1 so that IF the task runs
# it at least holds the deployed app version instead of downgrading.
#
# Before running that task: `helm list -n longhorn-system` and confirm which
# chart lineage you intend to end up on.
longhorn_version: "1.11.1"

# kube-prometheus-stack
# Must track the deployed release, NOT bump independently: the live release is
# chart 83.7.0 (revision 8), upgraded by hand on 2026-07-17 without updating
# this var. A run pinned to an older value than what's deployed downgrades the
# Prometheus Operator while the newer CRDs stay installed — a break that looks
# like whatever change happened to run first caused it, not the version drift.
# Verify against `helm list -n monitoring` before changing.
kube_prometheus_stack_version: "83.7.0"
pve_exporter_version: "3.5.1"
