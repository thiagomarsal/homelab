---
- name: Check reboot-required on PVE hosts
  hosts: pve
  tasks:
    - name: Check reboot-required flag
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Record reboot status
      set_fact:
        needs_reboot: "{{ reboot_required_file.stat.exists }}"

- name: Summarize reboot status
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Report hosts needing reboot
      debug:
        msg: "{{ item }} needs reboot"
      loop: "{{ groups['pve'] }}"
      when: hostvars[item].needs_reboot | default(false)
