---
- name: Set up n8n automation access on PVE hosts
  hosts: pve
  vars:
    svc_user: svc-n8n
  tasks:
    - name: Remove unused svc-n8n user (forced-command root key used instead)
      user:
        name: "{{ svc_user }}"
        state: absent
        remove: yes

    - name: Deploy apt-upgrade/healthcheck wrapper script
      copy:
        dest: /usr/local/sbin/n8n-apt-upgrade.sh
        owner: root
        group: root
        mode: "0700"
        content: |
          #!/bin/bash
          # Forced-command target for the n8n automation SSH key.
          # sshd always execs this script regardless of client-requested command;
          # the client's requested command survives in $SSH_ORIGINAL_COMMAND and
          # selects the branch below. This lets one restricted key serve both the
          # monthly upgrade+reboot job and the post-reboot health check.
          #
          # n8n's SSH node prepends its "cwd" setting, sending "cd / ; healthcheck"
          # rather than "healthcheck". Strip any leading "cd <path> ;" or "cd <path> &&"
          # before matching — without this every request fell through to the reject
          # branch and the upgrade job silently did nothing.
          REQUEST="${SSH_ORIGINAL_COMMAND##*&& }"
          REQUEST="${REQUEST##*; }"
          REQUEST="${REQUEST#"${REQUEST%%[![:space:]]*}"}"   # ltrim
          REQUEST="${REQUEST%"${REQUEST##*[![:space:]]}"}"   # rtrim
          case "$REQUEST" in
            healthcheck)
              # Quorum alone is not health. On 2026-09-01 pve03 rebooted quorate
              # with the pfSense VM running and its WAN card absent from the PCI
              # bus, so this branch returned HEALTHY while the whole site was
              # offline. A bridge missing one of its ports is what that looks
              # like from here, so it is now part of the verdict.
              #
              # Detail goes to stderr and syslog, never stdout: n8n matches on the
              # stdout token, so stdout stays exactly "HEALTHY" or "NOT_HEALTHY"
              # and the existing workflow keeps parsing it unchanged.
              DETAIL=""
              if ! { systemctl is-active --quiet corosync && pvecm status 2>/dev/null | grep -q "Quorate"; }; then
                DETAIL="corosync down or node not quorate"
              fi
              BROKEN=$(awk '
                /^[[:space:]]*iface[[:space:]]+/ { cur=$2 }
                /^[[:space:]]*bridge[-_]ports[[:space:]]+/ {
                  for (i=2;i<=NF;i++) if ($i != "none") print cur, $i
                }' /etc/network/interfaces 2>/dev/null | while read -r br port; do
                if [ ! -e "/sys/class/net/$port" ]; then
                  echo "bridge $br: port $port does not exist (PCI device missing?)"
                elif [ ! -e "/sys/class/net/$br/brif/$port" ]; then
                  echo "bridge $br: port $port exists but is not enslaved"
                fi
              done)
              if [ -n "$BROKEN" ]; then
                DETAIL="${DETAIL:+${DETAIL}; }${BROKEN}"
              fi
              if [ -z "$DETAIL" ]; then
                echo "HEALTHY"
                exit 0
              fi
              echo "$DETAIL" >&2
              logger -t n8n-apt-upgrade "healthcheck failed: ${DETAIL}"
              echo "NOT_HEALTHY"
              exit 1
              ;;
            upgrade)
              set -e
              BEFORE_KERNEL=$(uname -r)
              apt-get update
              apt-get dist-upgrade -y
              apt-get autoremove -y
              # Drop the .debs dist-upgrade just downloaded. Without this the
              # cache is never emptied and grows by a monthly increment forever:
              # on 2026-08-28 the fleet was holding 7.0GB across 8 hosts, with
              # pve01 at 2.3GB on its 68GB root. Best-effort on purpose — `set -e`
              # is active in this branch and a failed cache cleanup must never
              # abort an otherwise-successful upgrade or skip the reboot below.
              apt-get clean || logger -t n8n-apt-upgrade "apt-get clean failed (non-fatal)"
              # grep '^[0-9]' because the glob also matches proxmox-kernel-helper,
              # which stripped of its prefix sorts last and made the report claim
              # LATEST_INSTALLED_KERNEL=helper.
              LATEST_KERNEL=$(dpkg -l 'proxmox-kernel-*' 2>/dev/null | awk '/^ii/{print $2}' | sed 's/^proxmox-kernel-//' | grep -E '^[0-9]' | sort -V | tail -1)
              echo "BEFORE_KERNEL=${BEFORE_KERNEL}"
              echo "LATEST_INSTALLED_KERNEL=${LATEST_KERNEL}"
              echo "UPGRADE_OK"
              nohup bash -c 'sleep 5 && reboot' >/dev/null 2>&1 &
              disown
              ;;
            *)
              # Log the raw request so a future mismatch is diagnosable from syslog
              # instead of only surfacing as an opaque "unknown command" in n8n.
              logger -t n8n-apt-upgrade "rejected request: ${SSH_ORIGINAL_COMMAND}"
              echo "unknown command" >&2
              exit 1
              ;;
          esac

    # run_once because /root/.ssh/authorized_keys is a symlink to
    # /etc/pve/priv/authorized_keys — one pmxcfs-backed file shared by the whole
    # cluster. Letting all 8 hosts run this task in parallel raced the module's
    # read-check-append and appended a duplicate key on every playbook run.
    - name: Install n8n key restricted to wrapper script only (cluster-shared file)
      authorized_key:
        user: root
        key: "{{ n8n_pve_pubkey }}"
        key_options: 'command="/usr/local/sbin/n8n-apt-upgrade.sh",no-port-forwarding,no-X11-forwarding,no-agent-forwarding,no-pty,from="192.168.1.0/24"'
      run_once: true
