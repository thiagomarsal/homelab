---
# Installs Promtail on each Proxmox VE node to ship logs to Loki.
#
# Ships: the systemd/kernel journal (journald), as a single `job=pve-journal`
# stream per host. PVE 9 is Debian 13 (trixie), where rsyslog is not enabled
# by default, so /var/log/syslog, /var/log/kern.log, /var/log/auth.log and
# /var/log/pve/*.log do not exist — an earlier, file-based version of this
# playbook scraped those paths and shipped nothing, on every host, forever,
# with no error. Kernel, auth, and PVE task-log messages all land in journald
# regardless, so scraping the journal directly (the same approach the
# in-cluster promtail DaemonSet already uses successfully — see
# kubernetes/monitoring/promtail/values.yaml) is what actually works here.
#
# Requires: Loki IngressRoute deployed and accessible at loki.tmf-solutions.com.
- name: Install Promtail on PVE nodes
  hosts: pve
  become: true
  vars:
    promtail_config: "/etc/promtail/config.yml"

  tasks:
    - name: Install qemu-guest-agent
      apt:
        name: qemu-guest-agent
        state: present
        update_cache: true

    - name: Enable and start qemu-guest-agent
      systemd:
        name: qemu-guest-agent
        enabled: true
        state: started
      ignore_errors: true  # bare-metal PVE nodes have no virtio channel; skip gracefully

    - name: Create promtail directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /etc/promtail
        - /var/lib/promtail

    - name: Download Promtail deb package
      get_url:
        url: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail_{{ promtail_version }}_amd64.deb"
        dest: /tmp/promtail.deb
        mode: '0644'
        force: false

    - name: Install Promtail deb package
      apt:
        deb: /tmp/promtail.deb
        state: present

    - name: Write Promtail config
      copy:
        dest: "{{ promtail_config }}"
        mode: '0644'
        content: |
          server:
            http_listen_port: 9080
            grpc_listen_port: 0

          positions:
            filename: /var/lib/promtail/positions.yaml

          clients:
            - url: {{ loki_push_url }}

          scrape_configs:
            - job_name: journal
              journal:
                path: /var/log/journal
                max_age: 12h
                labels:
                  job: pve-journal
                  host: {{ inventory_hostname }}
              relabel_configs:
                - source_labels: ['__journal__systemd_unit']
                  target_label: unit
                - source_labels: ['__journal_syslog_identifier']
                  target_label: syslog_identifier
                - source_labels: ['__journal_priority']
                  target_label: priority

    # --- Fallback: rsyslog + file-based scraping -----------------------------
    # Use this ONLY if the verification tasks below fail because promtail's
    # binary lacks journal support (message: "promtail built without journal
    # support"). journald reading requires promtail to be linked against
    # libsystemd/libjournal at build time; the upstream .deb has historically
    # varied on this, and it could not be confirmed read-only on this fleet
    # (pve01's binary is static, so `ldd` shows nothing either way).
    #
    # If that turns out to be the case: install rsyslog so it populates
    # /var/log/syslog, /var/log/kern.log, and /var/log/auth.log again (PVE task
    # logs still won't reappear under /var/log/pve on trixie without further
    # rsyslog config), then revert the "Write Promtail config" task above to
    # the file-based scrape_configs this playbook used before this change, and
    # revert kubernetes/monitoring/loki/ruler-rules.yml's job selectors back to
    # job="kernel" et al.
    #
    # - name: "[FALLBACK] Install rsyslog"
    #   apt:
    #     name: rsyslog
    #     state: present
    #     update_cache: true
    #
    # - name: "[FALLBACK] Enable and start rsyslog"
    #   systemd:
    #     name: rsyslog
    #     enabled: true
    #     state: restarted
    # --------------------------------------------------------------------

    - name: Install Promtail systemd service
      copy:
        dest: /etc/systemd/system/promtail.service
        mode: '0644'
        content: |
          [Unit]
          Description=Promtail log shipper
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/promtail -config.file={{ promtail_config }}
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    # This is the ONLY restart in the play (no handler-based restart exists
    # any more — see the note above this task's neighbours). It runs
    # unconditionally, so both a first-time install (pve05) and a config
    # change on an existing host (pve01) always end up with a promtail
    # process running the config just written, and the verification block
    # immediately below is checking that exact process, not one that gets
    # replaced by a deferred handler restart afterward.
    - name: Enable and start Promtail
      systemd:
        name: promtail
        enabled: true
        state: restarted
        daemon_reload: true

    # --- Verification: prove promtail is actually shipping entries ----------
    # The failure mode this playbook has already hit once is silent: the
    # service reports active, the config parses, targets log "Adding target",
    # and yet nothing is ever pushed to Loki. Don't trust "started" — check
    # the metric that only increments once a log line is read AND sent.
    - name: Confirm Promtail service is active
      command: systemctl is-active promtail
      register: promtail_active
      changed_when: false
      failed_when: promtail_active.stdout != "active"

    - name: Wait for Promtail to read and push journal entries
      pause:
        seconds: 15

    - name: Read Promtail metrics
      uri:
        url: "http://localhost:9080/metrics"
        return_content: true
      register: promtail_metrics
      failed_when: false

    - name: Fail loudly if Promtail is not answering on :9080 at all
      fail:
        msg: >-
          Promtail on {{ inventory_hostname }} passed the "systemctl
          is-active" check but http://localhost:9080/metrics did not answer
          with 200 15s after restart (got: {{ promtail_metrics.status |
          default('no response') }}). This is a different failure shape than
          "shipped zero entries" — the process is not serving its metrics
          endpoint at all, which usually means it crashed or hung
          immediately after the restart (check `journalctl -u promtail -n50`
          as root) rather than a journal-support or /var/log/journal
          problem.
      when: promtail_metrics.status is not defined or promtail_metrics.status != 200

    - name: Extract promtail_sent_entries_total
      set_fact:
        promtail_sent_entries: >-
          {{
            promtail_metrics.content
            | regex_findall('^promtail_sent_entries_total\{[^}]*\}\s+([0-9.e+]+)', multiline=True)
            | map('float')
            | sum
          }}

    - name: Fail loudly if Promtail has not actually shipped anything
      fail:
        msg: >-
          Promtail on {{ inventory_hostname }} is active but
          promtail_sent_entries_total is {{ promtail_sent_entries }} (0 or
          metric absent) 15s after restart. Config parsing and "service
          active" do NOT mean logs are shipping — this is the exact silent
          failure this playbook was rewritten to catch. Likely causes:
          (1) this promtail binary was built without journal support, in
          which case switch to the commented-out rsyslog fallback block in
          this playbook and revert to file-based scrape_configs; or
          (2) /var/log/journal is missing, empty, or unreadable by the
          promtail process on this host — check with `journalctl -k -n5`
          and `ls -la /var/log/journal` as root. Do not consider this host's
          log shipping working until promtail_sent_entries_total is nonzero.
      when: (promtail_sent_entries | float(0)) == 0
