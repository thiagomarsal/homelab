---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  strategy:
    type: Recreate  # RWO PVC — same reason as n8n and porquinho
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.4-slim
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: open-webui-config
            - secretRef:
                name: open-webui-secret
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            # Slim image, cloud-only (no local embedding/reranking models
            # loaded — see Global Constraints). A 2025 community measurement
            # put bare Open WebUI near 1Gi RSS; this leaves headroom above
            # that without taking memory these 10-12Gi nodes don't have to
            # give, the same sizing discipline porquinho's own values.yaml
            # documents at length.
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
