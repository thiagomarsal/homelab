apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-ddns
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      containers:
      - name: ddns
        # Pinned to the digest actually running (verified 2026-09-20) — oznu/cloudflare-ddns
        # has had NO version tags since 2021 (repo is effectively abandoned upstream), so
        # `:latest` was the only tag available and gave zero drift protection. If this ever
        # needs to move, consider a maintained fork (e.g. favonia/cloudflare-ddns) instead.
        image: oznu/cloudflare-ddns@sha256:19bd73d8aea9641dc329ec18ae693b2b9c33ff7cdc007f368266ce584446f995
        imagePullPolicy: IfNotPresent
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: cloudflare-token
              key: cloudflare-token
        - name: ZONE
          value: "tmf-solutions.com"
        - name: SUBDOMAIN
          value: ""
        - name: PROXIED
          value: "true" 
        resources:
          limits:
            cpu: 50m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
      restartPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns-auburn
  namespace: cloudflare-ddns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-ddns-auburn
  template:
    metadata:
      labels:
        app: cloudflare-ddns-auburn
    spec:
      containers:
      - name: ddns
        # Pinned to the digest actually running (verified 2026-09-20) — see cloudflare-ddns
        # deployment above for why this is a digest, not a tag.
        image: oznu/cloudflare-ddns@sha256:19bd73d8aea9641dc329ec18ae693b2b9c33ff7cdc007f368266ce584446f995
        imagePullPolicy: IfNotPresent
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: cloudflare-token
              key: cloudflare-token
        - name: ZONE
          value: "auburn-fields.com"
        - name: SUBDOMAIN
          value: ""
        - name: PROXIED
          value: "true"
        resources:
          limits:
            cpu: 50m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
      restartPolicy: Always