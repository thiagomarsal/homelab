---
# Deny-all for xmlrpc.php: allow-list contains only a TEST-NET-1 address that no client can have.
# Nothing legitimate uses xmlrpc (no Jetpack/mobile app); logs showed ~2.2k scanner POSTs / 72h.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hoa-block-xmlrpc
  namespace: hoa
spec:
  ipAllowList:
    sourceRange:
      - 192.0.2.1/32
---
# Origin-bypass protection: pfSense forwards WAN:80/443 -> 192.168.1.61 (Traefik) from `*`
# source, with no restriction (confirmed 2026-10-10). That means the home WAN IP, if
# discovered, reaches Traefik directly, skipping Cloudflare entirely -- which also skips
# Turnstile/WAF and lets CF-Connecting-IP be spoofed for any IP-based logic (e.g. a login
# rate-limiter keyed on it). This allow-lists Cloudflare's published edge ranges
# (https://www.cloudflare.com/ips-v4, /ips-v6, fetched 2026-10-10) plus the cluster's own
# networks, since this cluster uses split-horizon DNS: LAN clients resolve
# *.tmf-solutions.com straight to 192.168.1.61 and never touch Cloudflare.
# Scoped to the hoa-auburn route only -- other sites on this Traefik are out of scope today.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hoa-origin-protection
  namespace: hoa
spec:
  ipAllowList:
    sourceRange:
      # Cloudflare IPv4
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      # Cloudflare IPv6
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
      # Homelab LAN (split-horizon DNS resolves *.tmf-solutions.com here directly)
      - 192.168.1.0/24
      # Cluster pod network (Traefik's own health probes, in-cluster requests)
      - 10.42.0.0/16
---
# Low-risk browser hardening headers. HSTS and CSP intentionally omitted (HSTS hard to roll
# back; CSP can break Elementor / Fluent Forms scripts).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hoa-security-headers
  namespace: hoa
spec:
  headers:
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      X-Frame-Options: SAMEORIGIN
