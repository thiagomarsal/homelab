---
# NOTE: xmlrpc.php blocking moved to the cluster-wide block-probes route
# (kubernetes/system/traefik/middlewares.yml). Only hoa-specific middlewares remain here.
#
# Origin-bypass protection is NO LONGER done here. It moved to pfSense: the WAN 80/443
# port forwards accept only the auto-updating CF_IPv4 alias (Cloudflare's ranges), so direct hits on
# the home WAN IP never reach Traefik (applied and verified 2026-11-20; see
# docs/runbooks/edge-protection.md). That also keeps CF-Connecting-IP unspoofable from the
# internet for the login rate-limiter. The old per-site copy of the Cloudflare range list was
# removed because it went stale.
---
# Low-risk browser hardening headers. HSTS and CSP intentionally omitted (HSTS hard to roll
# back; CSP can break Elementor / Fluent Forms scripts).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hoa-security-headers
  namespace: hoa
spec:
  headers:
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      X-Frame-Options: SAMEORIGIN
      X-Powered-By: ""  # empty value = Traefik strips the header; PHP sets this (expose_php)
