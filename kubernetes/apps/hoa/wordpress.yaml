---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hoa-wordpress-data
  namespace: hoa
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-php-uploads
  namespace: hoa
data:
  uploads.ini: |
    upload_max_filesize = 5M
    post_max_size = 8M
    max_execution_time = 60
---
# Caps Apache prefork so a request flood queues instead of spawning up to the stock 150
# workers (~40-60 MB each) inside a 1Gi limit; that was the Nov 3 OOMKill. Loaded from
# conf-enabled, i.e. after mods-enabled/mpm_prefork.conf, so these values win.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-apache-mpm
  namespace: hoa
data:
  mpm-tuning.conf: |
    <IfModule mpm_prefork_module>
        StartServers            4
        MinSpareServers         3
        MaxSpareServers         8
        MaxRequestWorkers       20
        MaxConnectionsPerChild  2000
    </IfModule>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: hoa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  strategy:
    type: Recreate  # required — PVC is RWO, only one pod at a time
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: wordpress:6.7.2-apache  # bump deliberately
          ports:
            - containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: "mariadb.hoa.svc.cluster.local:3306"
            # Behind Traefik (TLS terminated at proxy): trust X-Forwarded-Proto
            # and pin the site URLs so WP builds https links and avoids redirect loops.
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', 'https://auburn-fields.com');
                define('WP_SITEURL', 'https://auburn-fields.com');
                define('WP_CACHE', true);
                if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
                    $_SERVER['HTTPS'] = 'on';
                }
          envFrom:
            - secretRef:
                name: hoa-db-secret  # provides WORDPRESS_DB_NAME/USER/PASSWORD (extra MARIADB_* keys are harmless)
          volumeMounts:
            - name: data
              mountPath: /var/www/html
            - name: newsletter-plugin
              mountPath: /var/www/html/wp-content/mu-plugins/auburn-fields-newsletter.php
              subPath: auburn-fields-newsletter.php
              readOnly: true
            - name: irrigation-plugin
              mountPath: /var/www/html/wp-content/mu-plugins/auburn-fields-irrigation-admin.php
              subPath: auburn-fields-irrigation-admin.php
              readOnly: true
            - name: login-rate-limit-plugin
              mountPath: /var/www/html/wp-content/mu-plugins/auburn-fields-login-rate-limit.php
              subPath: auburn-fields-login-rate-limit.php
              readOnly: true
            - name: php-uploads-ini
              mountPath: /usr/local/etc/php/conf.d/uploads.ini
              subPath: uploads.ini
            - name: apache-mpm
              mountPath: /etc/apache2/conf-enabled/mpm-tuning.conf
              subPath: mpm-tuning.conf
              readOnly: true
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: "1"  # was 500m: probe-scan bursts were CPU-throttled (~26% of periods)
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hoa-wordpress-data
        - name: newsletter-plugin
          configMap:
            name: af-newsletter-plugin
        - name: irrigation-plugin
          configMap:
            name: af-irrigation-admin-plugin
        - name: login-rate-limit-plugin
          configMap:
            name: af-login-rate-limit-plugin
        - name: php-uploads-ini
          configMap:
            name: wordpress-php-uploads
        - name: apache-mpm
          configMap:
            name: wordpress-apache-mpm
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: hoa
spec:
  selector:
    app: wordpress
  ports:
    - port: 80
      targetPort: 80
