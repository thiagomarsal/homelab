---
# Delete failed Jobs once they are old enough to have been investigated.
#
# Why this exists: KubeJobFailed is driven by `kube_job_failed > 0`, and that
# metric lives as long as the Job *object* does. A later successful run does not
# clear it. So one failed Job with no TTL emails every day, forever, long after
# the cron behind it is healthy again. On 2026-09-01 five corpses from 2026-08-25
# were still paging — three nextcloud-cron, plus porquinho-nightly and
# hoa-nightly-backup — while every one of those crons was green.
#
# `failedJobsHistoryLimit` is not a fix. It caps how many failed Jobs are kept,
# but the survivor then lingers indefinitely; the two Longhorn jobs above were
# retained by exactly that mechanism (limit 1).
#
# Why a janitor instead of `ttlSecondsAfterFinished` on each CronJob: the Longhorn
# backup and trim CronJobs are generated by longhorn-manager from RecurringJob CRs
# and are owned by them (see ownerReferences). Longhorn's spec has no TTL field to
# set, and hand-patching a controller-owned object is silent drift that a Longhorn
# upgrade would rebuild away. CronJobs we do own set their own TTL as well — this
# is the backstop for the ones we cannot, and for anything deployed later.
#
# Deliberately age-bounded rather than "delete every failed Job". A failure inside
# the window still alerts and still has its pod logs available for the runbook.
# Only corpses past MAX_AGE_SECONDS are reaped, which is what turns a permanent
# daily email back into a single notification about a real event.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: failed-job-janitor
  namespace: monitoring
---
# Jobs are namespaced but the corpses appear in any namespace, so this has to be
# cluster-scoped. Kept to the narrowest verbs that do the work: no create, no
# patch, and no access to pods, secrets or anything else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: failed-job-janitor
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: failed-job-janitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: failed-job-janitor
subjects:
  - kind: ServiceAccount
    name: failed-job-janitor
    namespace: monitoring
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: failed-job-janitor
  namespace: monitoring
spec:
  # Every 6h rather than daily: Alertmanager's warning repeat_interval is 24h, so
  # this bounds a stale corpse to roughly one email rather than one per day.
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      # The janitor must not become the thing it cleans up.
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: failed-job-janitor
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          containers:
            - name: janitor
              # alpine/kubectl, not rancher/kubectl: the latter is distroless and
              # has no shell, so a script cannot run in it.
              image: alpine/kubectl:1.34.1
              env:
                - name: MAX_AGE_SECONDS
                  value: "86400"
              command:
                - sh
                - -c
                - |
                  set -eu
                  NOW=$(date -u +%s)
                  # A go-template rather than jsonpath: nested filters on
                  # status.conditions are unreliable in jsonpath, and busybox has
                  # no jq. Emits one "<ns> <name> <lastTransitionTime>" per failed
                  # Job and nothing at all when the cluster is clean.
                  kubectl get jobs --all-namespaces -o go-template='{{range .items}}{{$ns := .metadata.namespace}}{{$n := .metadata.name}}{{range .status.conditions}}{{if and (eq .type "Failed") (eq .status "True")}}{{$ns}} {{$n}} {{.lastTransitionTime}}{{"\n"}}{{end}}{{end}}{{end}}' \
                    > /tmp/failed.txt
                  echo "failed jobs found: $(wc -l < /tmp/failed.txt)"
                  while read -r NS NAME TS; do
                    [ -z "${NS:-}" ] && continue
                    # busybox date cannot parse RFC3339 without an explicit -D format.
                    FAILED_AT=$(date -u -D "%Y-%m-%dT%H:%M:%SZ" -d "$TS" +%s 2>/dev/null) || {
                      echo "WARN could not parse timestamp '$TS' for $NS/$NAME, skipping"
                      continue
                    }
                    AGE=$((NOW - FAILED_AT))
                    if [ "$AGE" -ge "$MAX_AGE_SECONDS" ]; then
                      echo "deleting $NS/$NAME (failed ${AGE}s ago)"
                      kubectl delete job -n "$NS" "$NAME"
                    else
                      echo "keeping  $NS/$NAME (failed ${AGE}s ago, under ${MAX_AGE_SECONDS}s)"
                    fi
                  done < /tmp/failed.txt
                  echo "janitor done"
