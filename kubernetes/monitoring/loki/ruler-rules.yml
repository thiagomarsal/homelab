---
# Loki ruler rules. Mounted at /rules/fake/ — "fake" is the tenant id Loki uses
# when auth_enabled: false.
#
# These cover failures that produce no metric: the e1000e TX ring hang that took
# pve06 off the network on 2026-08-15 appears only as a kernel log line.
#
# How this gets applied
# ----------------------
# Loki has NO Helm release record here (`helm list -A --kube-context homelab`
# shows zero loki releases, even though the resources exist and
# ansible/roles/rancher/tasks/main.yml still contains a `helm upgrade --install
# loki ...` task). Do not run `helm upgrade` against it: with resources present
# but no release record it fails, and `--install` would try to create objects
# that already exist. Until that's reconciled, apply and mount this rules
# ConfigMap by hand:
#
#   export KUBECONFIG=~/.kube/config
#
#   # 1. Complete the `ruler:` stanza in the live Loki config ConfigMap. The
#   #    chart already ships a partial one (storage.type: local + a wal dir),
#   #    but with no local.directory, no rule_path and — the part that matters —
#   #    no alertmanager_url, so rules would evaluate and notify nobody:
#   kubectl --context homelab edit cm -n monitoring loki
#
#   # 2. Apply this rules ConfigMap. Its `loki_rule` label and
#   #    k8s-sidecar-target-directory annotation are what deliver it:
#   kubectl --context homelab apply -f kubernetes/monitoring/loki/ruler-rules.yml
#
#   # 3. Restart Loki so it re-reads the config from step 1 (the sidecar picks
#   #    up step 2 by itself within seconds — no restart needed for rules):
#   kubectl --context homelab rollout restart statefulset/loki -n monitoring
#   kubectl --context homelab rollout status  statefulset/loki -n monitoring --timeout=180s
#
# CORRECTED 2026-08-17 (at apply time). This section previously prescribed
# adding a `ruler-rules` volume and a /rules/fake volumeMount to the
# StatefulSet by JSON patch. Do NOT do that: the chart already mounts an
# emptyDir named sc-rules-volume at /rules in BOTH the loki container and a
# loki-sc-rules sidecar, so a second volume at the same path either collides
# or is silently shadowed, and hand-patching a StatefulSet the chart owns gets
# reverted the moment anything reconciles it. The sidecar is the supported
# path and needs no StatefulSet change at all.
#
# Verify the ruler loaded the rules with:
#   kubectl --context homelab port-forward -n monitoring svc/loki 13100:3100 &
#   curl -s localhost:13100/loki/api/v1/rules
#
# NOTE ON LABELS (updated 2026-08-17, Task 10): ansible/playbooks/infra/
# promtail-pve.yml now ships PVE logs from journald, not from /var/log files
# — PVE 9 is Debian 13 (trixie), rsyslog is not enabled there by default, and
# the old file-based config was scraping paths that never existed, so it
# shipped nothing to any host, ever. The journal-based config emits a single
# stream per host labeled `job="pve-journal"`, `host="<pve inventory_hostname>"`
# (e.g. pve01…pve08 — set explicitly from inventory_hostname, not the
# journal's own `_HOSTNAME` field, so it lines up with the `pve_host` values
# the Prometheus rules and Alertmanager inhibition already use). The rules
# below match on `job="pve-journal"` and message text only, deliberately not
# on a `syslog_identifier` relabel, since a wrong guess there would make the
# rule go silent again for no visible reason while the message strings
# themselves are already distinctive enough.
#
# RESOLVED 2026-08-17: promtail-pve.yml has been applied to all 8 PVE hosts and
# every one is shipping (promtail_sent_entries_total non-zero fleet-wide), Loki
# reports all 8 values for the `host` label under job="pve-journal", and this
# ConfigMap is loaded by the sidecar with all three rules evaluating at
# health: ok. The label values above are therefore confirmed against a live
# stream, not inferred: replaying the pve07 incident through Loki returns 300
# hangs per 10m window on host="pve07".
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-ruler-rules
  namespace: monitoring
  labels:
    # The Loki chart runs a k8s-sidecar container (loki-sc-rules) alongside Loki
    # with METHOD=WATCH, LABEL=loki_rule, FOLDER=/rules, sharing an emptyDir with
    # the loki container. Carrying this label is the entire delivery mechanism —
    # the sidecar copies this ConfigMap into /rules on its own, with no
    # StatefulSet change and no Loki restart.
    loki_rule: "1"
  annotations:
    # Loki's local rule store expects <directory>/<tenant>/, and the tenant is
    # "fake" when auth_enabled is false. k8s-sidecar writes flat into FOLDER
    # unless told otherwise, so this annotation puts the file in the per-tenant
    # subdirectory the ruler actually reads.
    k8s-sidecar-target-directory: /rules/fake
data:
  pve-logs.yaml: |
    groups:
      - name: pve.kernel
        interval: 1m
        rules:
          # Threshold calibrated against real fleet data on 2026-08-17, not guessed.
          #
          # CORRECTED same day: an earlier version of this comment claimed mitigated hosts
          # log ~3 hangs/day that the driver recovers. That was a measurement artifact —
          # `journalctl | grep "Detected Hardware Unit Hang:"` also matches the journal's
          # own record of the ansible command containing that string. Counted properly with
          # `journalctl -k`, mitigated hosts show ZERO hangs (pve05/06 over 27h, pve07/08
          # since mitigation). Do not grep a journal for a string your own command contains.
          #
          # The threshold stays >10 regardless, and the headroom is now larger, not smaller:
          #
          # The catastrophic mode looks completely different. When pve07 wedged that day it
          # logged 4,658 hangs in 2h35m — a steady 1,800/hour, one every 2 seconds — with
          # ZERO reset attempts, and stayed off the network until it was power-cycled. That
          # is ~300 hangs per 10m window, against zero on a healthy mitigated host, so any
          # threshold in between separates them cleanly.
          #
          # 10 is deliberately low in that gap: a genuine wedge crosses it in ~20 seconds,
          # while leaving room for the odd isolated hang to pass without paging anyone.
          - alert: PVENICHang
            expr: |
              sum by (host) (
                count_over_time({job="pve-journal"} |= "Detected Hardware Unit Hang" [10m])
              ) > 10
            for: 0m
            labels:
              severity: critical
              pve_host: '{{ $labels.host }}'
            annotations:
              summary: "e1000e NIC wedged on {{ $labels.host }} — sustained TX ring hangs"
              description: >-
                More than 10 hangs in 10 minutes means the TX ring is stuck rather than
                blipping. On 2026-08-17 this pattern took pve07 off the network for 2h35m
                and only a power cycle recovered it; the driver logged no reset attempts.
                Check whether the host is still reachable at all — it will keep running and
                logging while shipping no packets. Confirm the offload mitigation is active
                (systemctl is-enabled e1000e-offload-fix.service; ethtool -k <iface> should
                show tcp/generic-segmentation-offload off), and expect a power cycle if the
                NIC has already stopped responding to ARP.

          - alert: PVEKernelOOM
            expr: |
              sum by (host) (
                count_over_time({job="pve-journal"} |~ "Out of memory: Killed process" [15m])
              ) > 0
            for: 0m
            labels:
              severity: warning
              pve_host: '{{ $labels.host }}'
            annotations:
              summary: "OOM killer fired on {{ $labels.host }}"
              description: "A process was killed for memory. Check which guest or service grew."

          # Same "absence is the signal" pattern as PVEMetricsAbsent/
          # LonghornMetricsAbsent/CertMetricsAbsent, applied to log shipping
          # instead of a scraped metric: a dead promtail or a journal that
          # stops being persistent silently returns the fleet to the
          # pre-Task-10 broken state, and PVENICHang/PVEKernelOOM would go
          # quiet with nothing saying so. NOTE: this rule cannot detect Loki
          # itself being down — if Loki is down, this rule isn't evaluating
          # either. That gap is Uptime Kuma's job (its prometheus/alertmanager
          # health checks are the same idea, applied off-cluster).
          - alert: PVELogsAbsent
            expr: |
              absent_over_time({job="pve-journal"}[1h])
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "No PVE journal logs reaching Loki for an hour"
              description: "PVENICHang and PVEKernelOOM cannot fire while this is true. Check promtail on the PVE hosts: systemctl status promtail, then curl localhost:9080/metrics | grep promtail_sent_entries_total."
