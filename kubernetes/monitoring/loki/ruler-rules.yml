---
# Loki ruler rules. Mounted at /rules/fake/ — "fake" is the tenant id Loki uses
# when auth_enabled: false.
#
# These cover failures that produce no metric: the e1000e TX ring hang that took
# pve06 off the network on 2026-08-15 appears only as a kernel log line.
#
# How this gets applied
# ----------------------
# Loki has NO Helm release record here (`helm list -A --kube-context homelab`
# shows zero loki releases, even though the resources exist and
# ansible/roles/rancher/tasks/main.yml still contains a `helm upgrade --install
# loki ...` task). Do not run `helm upgrade` against it: with resources present
# but no release record it fails, and `--install` would try to create objects
# that already exist. Until that's reconciled, apply and mount this rules
# ConfigMap by hand:
#
#   export KUBECONFIG=~/.kube/config
#
#   # 1. Add the `ruler:` stanza documented in values.yaml (see that file) to
#   #    the live Loki config ConfigMap so the ruler component is enabled:
#   kubectl --context homelab edit cm -n monitoring loki
#
#   # 2. Apply this rules ConfigMap:
#   kubectl --context homelab apply -f kubernetes/monitoring/loki/ruler-rules.yml
#
#   # 3. Mount it into the StatefulSet with a two-op JSON patch (add the
#   #    volume, then add the matching volumeMount at /rules/fake):
#   kubectl --context homelab patch statefulset loki -n monitoring --type=json -p='[
#     {"op":"add","path":"/spec/template/spec/volumes/-",
#      "value":{"name":"ruler-rules","configMap":{"name":"loki-ruler-rules"}}},
#     {"op":"add","path":"/spec/template/spec/containers/0/volumeMounts/-",
#      "value":{"name":"ruler-rules","mountPath":"/rules/fake"}}
#   ]'
#
#   # 4. Confirm the rollout picked it up:
#   kubectl --context homelab rollout status statefulset/loki -n monitoring --timeout=180s
#
# Verify the ruler loaded the rules with:
#   kubectl --context homelab port-forward -n monitoring svc/loki 13100:3100 &
#   curl -s localhost:13100/loki/api/v1/rules
#
# NOTE ON LABELS (updated 2026-08-17, Task 10): ansible/playbooks/infra/
# promtail-pve.yml now ships PVE logs from journald, not from /var/log files
# — PVE 9 is Debian 13 (trixie), rsyslog is not enabled there by default, and
# the old file-based config was scraping paths that never existed, so it
# shipped nothing to any host, ever. The journal-based config emits a single
# stream per host labeled `job="pve-journal"`, `host="<pve inventory_hostname>"`
# (e.g. pve01…pve08 — set explicitly from inventory_hostname, not the
# journal's own `_HOSTNAME` field, so it lines up with the `pve_host` values
# the Prometheus rules and Alertmanager inhibition already use). The rules
# below match on `job="pve-journal"` and message text only, deliberately not
# on a `syslog_identifier` relabel, since a wrong guess there would make the
# rule go silent again for no visible reason while the message strings
# themselves are already distinctive enough.
#
# This is STILL a deployment gap, not (as far as could be verified read-only)
# a labeling error: promtail-pve.yml has only ever been applied to pve01, and
# pve05 has no /etc/promtail and an inactive promtail service, so most of the
# fleet ships nothing regardless of which scrape config is correct. These
# rules remain inert — matching nothing, alerting on nothing — until an
# operator (a) runs promtail-pve.yml against every PVE host (its own
# verification tasks will fail loudly per-host if a host still isn't
# shipping), and (b) applies the ruler ConfigMap/StatefulSet patch documented
# above, since Loki has no Helm release record here and neither step happens
# via a normal `helm upgrade`. The exact label values above could not be
# confirmed against a live shipping stream without applying the playbook —
# see the Task 10 report for what was and wasn't verified read-only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-ruler-rules
  namespace: monitoring
data:
  pve-logs.yaml: |
    groups:
      - name: pve.kernel
        interval: 1m
        rules:
          - alert: PVENICHang
            expr: |
              sum by (host) (
                count_over_time({job="pve-journal"} |= "Detected Hardware Unit Hang" [10m])
              ) > 0
            for: 0m
            labels:
              severity: critical
              pve_host: '{{ $labels.host }}'
            annotations:
              summary: "e1000e NIC hang on {{ $labels.host }}"
              description: "Kernel reported a TX ring hang. This host drops off the network when it recurs. Mitigation is applied but the hardware fault is unrepaired."

          - alert: PVEKernelOOM
            expr: |
              sum by (host) (
                count_over_time({job="pve-journal"} |~ "Out of memory: Killed process" [15m])
              ) > 0
            for: 0m
            labels:
              severity: warning
              pve_host: '{{ $labels.host }}'
            annotations:
              summary: "OOM killer fired on {{ $labels.host }}"
              description: "A process was killed for memory. Check which guest or service grew."
