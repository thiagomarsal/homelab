# Loki Helm values — monolithic (SingleBinary) mode for homelab
# Chart: grafana/loki v6.55.0

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 7d
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
  # Ruler: evaluates log-based alert rules (kubernetes/monitoring/loki/ruler-rules.yml)
  # and forwards firing alerts to Alertmanager, the same as Prometheus recording
  # rules do for metrics. This is documentation only — Loki has no Helm release
  # record here, so this stanza is NOT currently applied via `helm upgrade`. It
  # was instead added to the live ConfigMap by hand (`kubectl edit cm -n
  # monitoring loki`); see the "How this gets applied" note at the top of
  # ruler-rules.yml. Keeping it here means a future reinstall (once the Helm
  # release is reconciled) won't silently lose the ruler config.
  ruler:
    enable_api: true
    storage:
      type: local
      local:
        directory: /rules
    rule_path: /tmp/loki-rules
    ring:
      kvstore:
        store: inmemory
    alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
    enable_alertmanager_v2: true

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn
    size: 10Gi
  # No node pinning or exclusion on purpose: let the scheduler place Loki. When
  # pve06 died on 2026-08-15 Loki went with it, but the cause was not placement —
  # a StatefulSet pod holding an RWO Longhorn volume cannot reschedule while its
  # node is unreachable, which is true of every node. See the Longhorn
  # node-down-pod-deletion-policy setting for the fix that actually applies.

# Disable scaled-out components — not needed in SingleBinary mode
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable bundled minio — using filesystem storage
minio:
  enabled: false

# Disable memcached caches — too memory-intensive for homelab nodes
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Disable bundled Grafana — already have kube-prometheus-stack
grafana:
  enabled: false

# Disable test pods
test:
  enabled: false
lokiCanary:
  enabled: false
